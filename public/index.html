        "title": "Trabalho Final",

    "content": "Trabalho Final Aluna: Maysa Cristina Claudino da Silva\nOrientador: Fabio Kon\nSimulação de mobilidade urbana sob chuvas extremas: O impacto de alagamentos na região central de São Paulo\nResumo O município de São Paulo sofre recorrentemente com alagamentos que impactam severamente a mobilidade urbana, um cenário agravado pelas mudanças climáticas. Compreender o aumento desses impactos é essencial para a gestão pública, mas faltam ferramentas que automatizem a relação entre dados pluviométricos e o comportamento do tráfego viário.\nEste trabalho propõe a extensão do simulador InterSCSimulator para integrar dados de chuva e alagamentos, permitindo a interdição dinâmica de vias e a redução de velocidade dos veículos conforme a intensidade da precipitação. As simulações realizadas na região central demonstraram que, embora o aumento na distância percorrida seja pequeno devido à conectividade da malha, o tempo de viagem sofre acréscimos significativos, chegando a quase 15% no período vespertino.\nObservou-se também que a localização e o momento da chuva são fatores tão críticos quanto o volume total precipitado. A ferramenta desenvolvida se mostrou eficaz para quantificar os efeitos de eventos climáticos, oferecendo apoio técnico para o planejamento de uma cidade mais resiliente.\nDocumentos Monografia 📄 Abrir a monografia em PDF\nPoster 📄 Abrir o poster em PDF\n",

    "http:\/\/localhost:1313\/tcc\/movimentacao-e-interdicao\/": {
        
        "title": "Movimentação e Interdição de Vias",
            "tags": [],
    "content": " Para simular o impacto de eventos pluviométricos na mobilidade, é fundamental modelar tanto o deslocamento padrão dos veículos quanto as alterações dinâmicas na malha viária, como a interdição de ruas. Esta seção detalha os mecanismos implementados no InterSCsimulator para essas duas funcionalidades.\nModelo de Movimentação de Veículos A malha viária da cidade é representada como um dígrafo, onde as vias são as arestas e os cruzamentos são os vértices. O movimento dos veículos se baseia no cálculo de rotas e na atualização contínua de sua posição e velocidade.\nCarros O deslocamento de um carro entre um ponto de origem e um de destino segue as seguintes etapas:\nCálculo de Rota: A rota é definida como uma lista de vértices que representa o menor caminho no dígrafo entre a origem e o destino. Ocupação da Via: Ao entrar em uma nova aresta (via), um contador que registra o número de veículos presentes nela é incrementado. Cálculo de Velocidade (m/s): A velocidade do veículo é calculada dinamicamente com base na ocupação da via. A fórmula considera o limite de velocidade da via, sua capacidade máxima e o número de veículos que nela trafegam. Fluxo Livre: Com a ocupação de até 30% da capacidade, os carros se movem na velocidade máxima permitida. Fluxo denso: Entre 30% e 100% da capacidade, a velocidade é progressivamente reduzida. Congestionamento: Ao atingir a capacidade máxima, a velocidade é drasticamente reduzida para um valor fixo (0,8 m/s), simulando uma condição de congestionamento. Agendamento: O simulador calcula o tempo que o veículo levará para percorrer a via e agenda sua próxima ação para o final desse período. Liberação da Via: Ao sair da via, o contador de ocupação é decrementado, e a velocidade dos veículos restantes é recalculada. Ônibus A lógica de movimentação para os ônibus é semelhante à dos carros, mas com ajustes que modelam o comportamento do transporte público:\nCálculo de Rota: A rota não é calculada apenas entre a origem e o destino final, mas sim como uma sequência de menores caminhos entre cada um dos pontos de parada da linha. Peso de Ocupação: Ao contabilizar a ocupação da via, um ônibus possui peso 3, representando um impacto maior no tráfego em comparação com um carro. Paradas: Quando um vértice da rota corresponde a um ponto de ônibus, o simulador executa o gerenciamento de embarque e desembarque de passageiros. Implementação de Interdição e Alteração de Vias A simulação de alagamentos exige que a malha viária possa ser alterada dinamicamente. Essa funcionalidade foi implementada na dissertação de mestrado de Lucas Kanashiro, que introduz um gerenciador de eventos e de grafos.\nDiferente da versão original do simulador, esta implementação conta com um gerenciador de grafo. Este agente é executado em um laço infinito, permitindo que outros processos enviem mensagens para adicionar ou remover vértices e arestas do dígrafo a qualquer momento.\nUm novo agente, o gerenciador de eventos, é responsável por ler um arquivo de entrada (events.xml) que descreve as alterações a serem aplicadas na malha viária durante a simulação.\nExistem dois tipos principais de eventos:\nFechamento Total de Via Esse evento instrui o gerenciador de grafo a remover a aresta correspondente à via interditada. O ID da aresta removida é inserido em uma tabela ETS com o status remove. As tabelas ETS (Erlang Term Storage) são um recurso da linguagem Erlang que funciona como um banco de dados em memória, permitindo consultas e alterações, o que é ideal para gerenciar o estado dinâmico das vias em tempo de simulação.\nAntes de acessar uma nova via, cada carro consulta essa tabela. Caso a próxima via de sua rota esteja marcada como removida, o carro recalcula seu trajeto a partir de sua posição atual, utilizando a versão mais recente do grafo.\nRedução de Capacidade da Via Este evento não remove a via, mas sim diminui sua capacidade, o que afeta diretamente o cálculo de velocidade dos veículos que passam por ela.\nPara ambos os casos, o gerenciador de eventos agenda uma ação futura para reverter a alteração, seja reinserindo a aresta no grafo ou restaurando a capacidade original da via.\n",

    "http:\/\/localhost:1313\/tcc\/mapas-analise-inicial\/": {
        
        "title": "Análise inicial dos dados e visualização em mapas",
            "tags": [],
    "content": "Análise preliminar dos dados de alagamentos e chuvas Nesta etapa inicial do projeto, foram construídos alguns mapas interativos com base nos dados de alagamentos e precipitação no município de São Paulo, referentes ao período de 2018 a 2023. O objetivo é identificar padrões espaciais que possam fundamentar as decisões na etapa de simulação da mobilidade urbana sob eventos de chuva intensa.\nPara facilitar a análise, foi agrupado em um único arquivo CSV os dados de alagamentos registrados pela Defesa Civil, os registros de ruas intransitáveis fornecidos pela Companhia de Engenharia de Tráfego (CET), e os índices pluviométricos correspondentes à data de cada ocorrência, obtidos do Centro de Gerenciamento de Emergências Climáticas (CGE).\nO conjunto abrange o período de 2018 a 2023. A escolha de não incluir ano de 2024 se deve ao fato de que os dados obtidos da CET deste ano estavam disponíveis apenas até o início de novembro e poderiam comprometer a comparação anual.\nOcorrências de alagamentos e ruas intransitáveis (2018–2023) 2018-2023 2018 2019 2020 2021 2022 2023 Mapas sem agrupamento 2018-2023 2018 2019 2020 2021 2022 2023 Densidade de ocorrências por km² – Subprefeituras de SP (2018–2023) 2018-2023 2018 2019 2020 2021 2022 2023 Perfil das regiões mais afetadas A análise dos mapas indica que as subprefeituras com maior número de ocorrências são Sé e São Miguel. No entanto, essas regiões apresentam características diferentes:\nEm São Miguel, observa-se alto número de alagamentos, mas poucas ocorrências de vias intransitáveis. Além disso, os registros estão bastante concentrados geograficamente. Já na Sé, as ocorrências são mais diversificadas e distribuídas pela região central. Dado o volume, a distribuição dos dados e a diversidade de meios de transporte (ônibus, metrô, ruas e avenidas), a região da Sé se mostra mais interessante para o desenvolvimento da simulação. Outro fator relevante é a presença de corpos hídricos como os rios Tamanduateí e Tietê, que podem influenciar nos eventos de alagamento.\nOcorrências sem chuva significativa Registros de ocorrências em dias com baixa ou nenhuma precipitação (filtrando os dados com \u0026ldquo;\u0026lt; 5 mm\u0026rdquo; no mapa de ocorrências) chamam a atenção. Um estudo do motivo desses casos pode ser relevante para implementar o simulador. Algumas hipóteses incluem:\nA possibilidade de alagamentos residuais causados por chuvas anteriores devido a qualidade da infraestrutura de drenagem. A influência da topografia, que pode favorecer o acúmulo de água com mais facilidade. Inconsistências nos registros: como os dados de precipitação do CGE são contabilizados das 00h às 23h59 de cada dia, é possível que em alguns casos a precipitação tenha ocorrido à noite, enquanto o alagamento tenha sido registrado apenas no dia seguinte? Verificação de dados com o Instituto Nacional de Meteorologia Para tentar esclarecer essa dúvida, realizamos uma verificação entre os dados de pluviometria do CGE e os da estação do Instituto Nacional de Meteorologia (INMET), localizada na subprefeitura de Santana-Tucuruvi.\nAbaixo, apresentamos um mapa que mostra o coeficiente de correlação de Pearson entre os dados de pluviometria do CGE de cada subprefeitura e os dados da estação do INMET, abrangendo o período de 2018 a 2023, em dias em que pelo menos uma das estações registrou pluviometria. O coeficiente de Pearson varia de 0 a 1, conforme a tabela a seguir:\nCoeficiente de Pearson Interpretação 0,00 – 0,09 Correlação insignificante 0,10 – 0,39 Correlação fraca 0,40 – 0,69 Correlação moderada 0,70 – 0,89 Correlação forte 0,90 – 1,00 Correlação muito forte A partir do mapa, é possível observar que as subprefeituras mais próximas à estação do INMET apresentam maiores coeficientes de correlação, sendo Santana-Tucuruvi o maior, com valor de 0,82, o que representa uma correlação forte. Dessa forma, a comparação entre as duas fontes de dados faz sentido principalmente nessas regiões. Em particular, temos interesse na subprefeitura da Sé cujo coeficiente é 0,74, também considerado uma correlação forte.\nCom base apenas nas datas das ocorrências, construímos os gráficos a seguir, que comparam os índices pluviométricos das duas fontes na Sé e em Santana-Tucuruvi:\nA análise dos gráficos mostra que, de fato, existem datas com registros de alagamento em que o CGE indicou baixa pluviometria enquanto o INMET indicou volumes mais elevados, e vice-versa. Também há casos em que ambos os órgãos registraram baixa pluviometria em dias com ocorrência de alagamentos.\n",

    "http:\/\/localhost:1313\/tcc\/proposta\/": {
        
        "title": "Proposta de trabalho",

    "content": "Simulação do impacto de eventos pluviométricos na mobilidade urbana da cidade de São Paulo Abrir a proposta em PDF\nMotivação De acordo com o Centro Nacional de Monitoramento e Alertas de Desastres Naturais, alagamentos são caracterizados pelo excesso na capacidade do escoamento do sistema de drenagem urbana. Essa condição é geralmente causada em função de precipitações intensas. Esses alagamentos ocasionam obstruções nas vias, levando à necessidade de alteração nos trajetos habituais da população, ou mesmo impossibilitando o deslocamento até o destino final.\nSegundo Marengo (2020), as chuvas extremas têm aumentado sua frequência no decorrer dos anos, portanto os alagamentos serão cada vez mais presentes e severos na rotina urbana. Este trabalho visa possibilitar a simulação e a análise de cenários de precipitações e alagamentos na cidade de São Paulo além dos seus impactos na mobilidade urbana.\nObjetivos Este trabalho tem como objetivo estender o software InterSCsimulator para que ele incorpore informações pluviométricas e de ocorrência de alagamentos. Dessa forma, busca-se estudar o impacto de eventos climáticos na mobilidade da cidade de São Paulo.\nA simulação deve permitir a modelagem de diferentes volumes de precipitação e os consequentes impactos sobre o tráfego urbano, alguns deles sendo: quais vias são afetadas por alagamentos, como os veículos (carros, ônibus e bicicletas) alteram sua rota padrão considerando as diferentes limitações de cada um, dentre outras possibilidades.\nCom base na simulação pretende-se extrair métricas relevantes relacionadas ao fenômeno e analisar o impacto causado na mobilidade geral, e a diferença dele em locais que foram ou não afetados pela chuva. Algumas dessas métricas podem ser: alteração no tempo médio da viagem, número de linhas de ônibus que passam pela área afetada e passageiros a bordo, acessibilidade da população a serviços de primeira necessidade tais como mercados, farmácias, hospitais e instituições de ensino.\nDado que São Paulo possui ampla extensão territorial, simular alagamentos em toda a cidade pode ser computacionalmente custoso, portanto, é provável que apenas parte dela seja simulada. A área será escolhida com base na análise de dados históricos existentes.\nMetodologia O InterSCsimulator é um simulador de tráfego para cidades inteligentes desenvolvido na linguagem Erlang, capaz de simular agentes urbanos tais como carros, pessoas e ônibus deslocando-se sobre a malha viária urbana. Será utilizada a rede viária da cidade São Paulo obtida por meio do projeto OpenStreetMap. As viagens da simulação serão baseadas na Pesquisa Origem Destino 2023 com mais de 35 milhões de viagens que representam os padrões de mobilidade da população metropolitana.\nPara atender os objetivos apresentados acima, os dados das vias serão enriquecidos com informações que correlacionam os casos de alagamentos com índices pluviométricos. Os pontos de alagamento de 2013 a 2024 foram extraídos a partir dos registros da Companhia de Engenharia de Trânsito e da Defesa Civil. O histórico de índices pluvioméricos do período está disponível na base de dados das estações pluviométricas do Instituto Nacional de Meteorologia e do Centro de Gerenciamento de Emergências Climáticas.\nAbaixo consta um cronograma das atividades planejadas, com a indicação do período estimado para sua conclusão.\nAtividade mar abr mai jun jul ago set out nov dez Estudo da linguagem Erlang x x Estudo do código-fonte do InterSCsimulator x x x Levantamento de dados históricos pluviométricos e de alagamentos x x Integração dos dados ao simulador x x Adaptar a simulação para considerar eventos pluviométricos x x x Análise dos impactos dos alagamentos na mobilidade urbana x x x Escrita da monografia x x x x x Referências CARVALHO, Raissa Barreto de. Análise de chuvas extremas e a relação com eventos de alagamentos na cidade de São Paulo – SP. 2021. 151 f. Dissertação (Mestrado em Desastres Naturais) – Instituto de Ciência e Tecnologia, Universidade Estadual Paulista (Unesp), São José dos Campos, 2021. Disponível em: http://hdl.handle.net/11449/217041. Acesso em: 18 abr. 2025.\nCEMADEN – Centro Nacional de Monitoramento e Alertas de Desastres Naturais. Inundação. Disponível em: http://www2.cemaden.gov.br/inundacao/. Acesso em: 14 abr. 2025.\nCOMPANHIA DO METROPOLITANO DE SÃO PAULO – METRÔ. Pesquisa Origem e Destino 2023. São Paulo: Metrô, 2025. Disponível em: https://www.metro.sp.gov.br/pt_BR/pesquisa-od/​. Acesso em: 14 abr. 2025.\nINSTITUTO NACIONAL DE METEOROLOGIA (INMET). Banco de Dados Meteorológicos para Ensino e Pesquisa – BDMEP. Brasília: INMET, [s.d.]. Disponível em: https://bdmep.inmet.gov.br/​. Acesso em: 18 abr. 2025.\nINTERSCITY. InterSCSimulator – A Smart City Simulator. Disponível em: https://interscity.org/software/interscsimulator/. Acesso em: 10 mar. 2025.\nMARENGO, J. A. et al. Changing trends in rainfall extremes in the Metropolitan Area of São Paulo: causes and impacts. Frontiers in Climate, v. 2, p. 3, 2020.\nPREFEITURA DO MUNICÍPIO DE SÃO PAULO. Alagamento (dados de ocorrências). São Paulo: GeoSampa, 2024. Disponível em: https://metadados.geosampa.prefeitura.sp.gov.br/geonetwork/srv/api/records/432c06b1-03a1-4b1f-9210-423e1b58e869​. Acesso em: 8 abr. 2025.\n",
